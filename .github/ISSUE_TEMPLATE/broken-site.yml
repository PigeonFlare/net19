name: Broken site
description: A themed site looks wrong, is missing something, or stopped working.
title: "[Broken] "
labels: ["broken site"]
body:
  - type: input
    id: url
    attributes:
      label: Website URL
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description (optional)
      placeholder: What looks wrong? Screenshots help.
