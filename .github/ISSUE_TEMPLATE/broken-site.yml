name: Broken site
description: A themed site looks wrong, is missing something, or stopped working.
title: "[Broken] "
labels: ["broken site"]
body:
  - type: input
    id: url
    attributes:
      label: Website URL
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser version
      description: Open chrome://version and copy the first line.
      placeholder: Google Chrome 141.0.7390.55 (Official Build) (arm64)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description (optional)
      placeholder: What looks wrong? Screenshots help.
