name: Request a site
description: Suggest a website that should get its 2019 design.
title: "[Request] "
labels: ["site request"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [open requests](https://github.com/PigeonFlare/net19/issues?q=is%3Aissue+label%3A%22site+request%22) first. If your site is there, add a 👍 to it instead; the most-voted sites are themed first.
  - type: input
    id: site
    attributes:
      label: Site
      placeholder: example.com
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What you'd want back
      description: The 2019 parts you miss, or the newer parts you'd want gone.
  - type: input
    id: reference
    attributes:
      label: 2019 reference (optional)
      description: A Wayback Machine or Web Design Museum link showing the site in 2019.
      placeholder: https://web.archive.org/web/2019/https://example.com
  - type: dropdown
    id: frequency
    attributes:
      label: How often do you use it?
      options:
        - Daily
        - Weekly
        - Now and then
